<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de baldios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    .sq { width: 12px; height: 12px; border: 1.5px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.6); }
    .popup-tabla td { padding: 2px 6px; vertical-align: top; font-size: 12px; }
    .popup-tabla td:first-child { font-weight: 600; white-space: nowrap; }
    .leyenda { background: #fff; padding: 8px 10px; border-radius: 4px; line-height: 1.7; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .leyenda i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; border: 1px solid #fff; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.js"></script>
  <script>
    // 1. Mapa base
    const map = L.map('map', {
      preferCanvas: true
    }).setView([-34.6, -58.45], 12);
    
    // Fondo Esri Light Gray
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors',
        maxZoom: 16
      }
    ).addTo(map);

    // 2. Utilidades: normaliza texto (sin acentos, mayúsculas) para comparar sin errores
    const norm = s => (s ?? '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase();

    // 3. Colores por STATUS
      
      const COLOR_CELESTE = '#8DE2D6';
      const COLOR_AMARILLO = '#FFCC00';
      const COLOR_GRIS_CLARO = '#C9CDD1';
      const COLOR_GRIS_OSCURO = '#93989e';
      
      const STATUS_CELESTE = ['REOK', 'TERC'];
      
      const STATUS_AMARILLO = [
        'INIC', 'OPER', 'PLAN', 'PROG', 'VERI'
      ];
      
      function colorPorStatus(status) {
        const s = norm(status);
      
        if (STATUS_CELESTE.includes(s)) return COLOR_CELESTE;
        if (STATUS_AMARILLO.includes(s)) return COLOR_AMARILLO;
      
        return COLOR_GRIS_CLARO;
      }

    // 4. Popup con todas las columnas
    function popupHTML(props) {
      const filas = Object.entries(props)
        .map(([k, v]) => `<tr><td>${k}</td><td>${v ?? ''}</td></tr>`)
        .join('');
      return `<table class="popup-tabla">${filas}</table>`;
    }

    // 5. Baldíos sin higienizar

      const baldios = L.geoJSON(null, {
        style: {
          color: '#45494D',
          weight: 0.7,
          fillColor: COLOR_GRIS_OSCURO,
          fillOpacity: 0.85
        },
      
        onEachFeature: (f, layer) => {
          layer.bindPopup(
            popupHTML(f.properties),
            { maxHeight: 300 }
          );
        }
      });
          
      // 6. Baldíos higienizados divididos por titularidad
      
      const opcionesHigienizados = {
      
        // Estilo para polígonos
        style: (f) => {
          const color = colorPorStatus(f.properties?.Status);
      
          return {
            color: '#ffffff',
            weight: 1,
            fillColor: color,
            fillOpacity: 0.9
          };
        },
      
        // Estilo para puntos (si existen)
        pointToLayer: (f, latlng) => {
          const color = colorPorStatus(f.properties?.Status);
      
          return L.circleMarker(latlng, {
            radius: 6,
            color: '#ffffff',
            weight: 1.5,
            fillColor: color,
            fillOpacity: 1
          });
        },
      
        onEachFeature: (f, layer) => {
          layer.bindPopup(
            popupHTML(f.properties),
            { maxHeight: 300 }
          );
        }
      };
      
      // Capa de titularidad privada
      const higienizadosPrivados = L.geoJSON(null, {
        ...opcionesHigienizados,
      
        filter: (f) =>
          norm(f.properties?.Titularidad) === 'PRIVADO'
      });
      
      // Capa de titularidad pública
      const higienizadosPublicos = L.geoJSON(null, {
        ...opcionesHigienizados,
      
        filter: (f) =>
          norm(f.properties?.Titularidad) === 'PUBLICO'
      });

  // 7. Carga de datos

      Promise.all([
        fetch('data/baldios.geojson').then(r => {
          if (!r.ok) throw new Error('Error cargando baldios');
          return r.json();
        }),
      
        fetch('data/higienizados.geojson').then(r => {
          if (!r.ok) throw new Error('Error cargando higienizados');
          return r.json();
        })
      ])
      
      .then(([b, h]) => {
      
        // Baldíos sin higienizar
        baldios.addData(b).addTo(map);
      
        // Higienizados privados
        higienizadosPrivados.addData(h).addTo(map);
      
        // Higienizados públicos
        higienizadosPublicos.addData(h).addTo(map);
      
        // Ajustar extensión del mapa
        const bounds = L.featureGroup([
          baldios,
          higienizadosPrivados,
          higienizadosPublicos
        ]).getBounds();
      
        if (bounds.isValid()) {
          map.fitBounds(bounds);
        }
      
        console.log('Capas cargadas correctamente');
      
      })
      
      .catch(error => {
        console.error('Error al cargar las capas:', error);
        alert('Error al cargar los datos: ' + error.message);
      });

    // 8. Control de capas agrupadas

      L.control.groupedLayers(null, {
      
        'Baldíos higienizados': {
          'Privado': higienizadosPrivados,
          'Público': higienizadosPublicos
        },
      
        'Otras capas': {
          'Baldíos sin higienizar': baldios
        }
      
      }, {
        collapsed: false
      }).addTo(map);

    
    // 9. Leyenda
      
      const leyenda = L.control({
        position: 'bottomright'
      });
      
      leyenda.onAdd = () => {
      
        const d = L.DomUtil.create('div', 'leyenda');
      
        d.innerHTML = `
          <b>STATUS</b><br>
      
          <i style="background:${COLOR_CELESTE}"></i>
          REOK / TERC<br>
      
          <i style="background:${COLOR_AMARILLO}"></i>
          INIC / OPER / PLAN / PROG / VERI<br>
      
          <i style="background:${COLOR_GRIS_CLARO}"></i>
          Otro higienizado<br>
      
          <b>OTROS</b><br>
      
          <i style="background:${COLOR_GRIS_OSCURO}"></i>
          Sin higienizar
        `;
      
        return d;
      };
      
      leyenda.addTo(map);

  </script>
</body>
</html>

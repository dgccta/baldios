<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de baldios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    .sq { width: 12px; height: 12px; border: 1.5px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.6); }
    .popup-tabla td { padding: 2px 6px; vertical-align: top; font-size: 12px; }
    .popup-tabla td:first-child { font-weight: 600; white-space: nowrap; }
    .leyenda { background: #fff; padding: 8px 10px; border-radius: 4px; line-height: 1.7; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .leyenda i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; border: 1px solid #fff; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Mapa base
    const map = L.map('map', {
      preferCanvas: true
    }).setView([-34.6, -58.45], 12);
    
    // Fondo Esri Light Gray
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors',
        maxZoom: 16
      }
    ).addTo(map);

    // 2. Utilidades: normaliza texto (sin acentos, mayúsculas) para comparar sin errores
    const norm = s => (s ?? '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase();

    // 3. Colores por STATUS
    const COLOR_CELESTE = '#8DE2D6';
    const COLOR_AMARILLO = '#FFCC00';
    const COLOR_GRIS_OSCURO = '#5F6368';
    const STATUS_CELESTE = ['REOK', 'TERC'];
    const STATUS_AMARILLO = ['INIC', 'OPER', 'PLAN', 'PROG', 'VERI'];

    function colorPorStatus(status) {
      const s = norm(status);
      if (STATUS_CELESTE.includes(s)) return COLOR_CELESTE;
      if (STATUS_AMARILLO.includes(s)) return COLOR_AMARILLO;
      return COLOR_GRIS_OSCURO;
    }

    // 4. Popup con todas las columnas
    function popupHTML(props) {
      const filas = Object.entries(props)
        .map(([k, v]) => `<tr><td>${k}</td><td>${v ?? ''}</td></tr>`)
        .join('');
      return `<table class="popup-tabla">${filas}</table>`;
    }

    // 5. Capa de baldios sin higienizar (gris claro)
    const baldios = L.geoJSON(null, {
      style: { color: '#bdbdbd', weight: 0.5, fillColor: '#e6e6e6', fillOpacity: 0.7 }
    });

    const higienizados = L.geoJSON(null, {

      // Estilo para polígonos
      style: (f) => {
        const color = colorPorStatus(f.properties?.Status);
    
        return {
          color: '#ffffff',
          weight: 1,
          fillColor: color,
          fillOpacity: 0.85
        };
      },
    
      // Símbolos para puntos
      pointToLayer: (f, latlng) => {
        const color = colorPorStatus(f.properties?.Status);
    
        if (norm(f.properties?.Titularidad) === 'PRIVADO') {
          return L.marker(latlng, {
            icon: L.divIcon({
              className: '',
              html: `<div class="sq" style="background:${color}"></div>`,
              iconSize: [12, 12],
              iconAnchor: [6, 6]
            })
          });
        }
    
        return L.circleMarker(latlng, {
          radius: 6,
          color: '#fff',
          weight: 1.5,
          fillColor: color,
          fillOpacity: 1
        });
      },
    
      onEachFeature: (f, layer) => {
        layer.bindPopup(popupHTML(f.properties), {
          maxHeight: 300
        });
      }
    
    });

    // 7. Carga de datos
    Promise.all([
      fetch('data/baldios.geojson').then(r => r.json()),
      fetch('data/higienizados.geojson').then(r => r.json())
    ]).then(([b, h]) => {
      baldios.addData(b).addTo(map);
      higienizados.addData(h).addTo(map);
      // Ajustar el mapa considerando ambas capas
      const bounds = L.featureGroup([
        baldios,
        higienizados
      ]).getBounds();
    
      if (bounds.isValid()) {
        map.fitBounds(bounds);
      }
    
      console.log('Capas cargadas correctamente');
    
    })
    .catch(error => {
      console.error('ERROR AL CARGAR EL MAPA:', error);
      alert('No se pudieron cargar los datos: ' + error.message);
    });;

    // 8. Control de capas
    L.control.layers(null, {
      'Baldios sin higienizar': baldios,
      'Baldios higienizados': higienizados
    }, { collapsed: false }).addTo(map);

    // 9. Leyenda
    const leyenda = L.control({ position: 'bottomright' });
    leyenda.onAdd = () => {
      const d = L.DomUtil.create('div', 'leyenda');
      d.innerHTML = `
        <b>STATUS</b><br>
        <i style="background:${COLOR_CELESTE}"></i>REOK / TERC<br>
        <i style="background:${COLOR_AMARILLO}"></i>INIC / OPER / PLAN / PROG / VERI<br>
        <i style="background:${COLOR_GRIS_OSCURO}"></i>Otro<br>
        <b>Titularidad</b><br>
        <i style="background:#999"></i>Privado (cuadrado)<br>
        <i style="background:#999;border-radius:50%"></i>Público (redondo)<br>
        <i style="background:#e6e6e6;border:1px solid #bdbdbd"></i>Sin higienizar`;
      return d;
    };
    leyenda.addTo(map);
  </script>
</body>
</html>
